services:
  trace-api:
    build: .
    image: board-trace-api:latest
    container_name: board-trace-api
    ports:
      - "8000:8000"
    environment:
      TRACE_DB_PATH: /data/trace.db
    volumes:
      - trace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  trace-data:
